<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кубик Рубика 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <!-- Минимальный интерфейс -->
    <div class="simple-ui">
        <!-- Левые кнопки -->
        <div class="left-controls">
            <button class="icon-btn" id="menuToggle" title="Меню">
                <i class="fas fa-bars"></i>
            </button>
            <button class="icon-btn mode-btn" data-mode="auto" title="Автоматическая сборка">
                <span>A</span>
            </button>
            <button class="icon-btn mode-btn" data-mode="manual" title="Ручная сборка">
                <span>P</span>
            </button>
        </div>

        <!-- Центр: кубик -->
        <div id="unity-container" class="unity-desktop">
            <canvas id="unity-canvas" width="500" height="500" tabindex="-1"></canvas>
            <div id="unity-loading-bar">
                <div id="unity-logo"></div>
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
            <div id="unity-warning"></div>
        </div>

        <!-- Правые кнопки -->
        <div class="right-controls">
            <button class="icon-btn" id="resetBtn" title="Сброс">
                <i class="fas fa-redo"></i>
            </button>
            <button class="icon-btn" id="hintBtn" title="Подсказка">
                <i class="fas fa-lightbulb"></i>
            </button>
            <button class="icon-btn" id="undoBtn" title="Шаг назад">
                <i class="fas fa-undo"></i>
            </button>
        </div>

        <!-- Панель отладки -->
        <div class="debug-panel">
            <div class="debug-info">
                <span id="debugStatus">Unity не загружен</span>
                <button id="testSpeed1" class="debug-btn">Тест скорости x1</button>
                <button id="testSpeed4" class="debug-btn">Тест скорости x4</button>
                <button id="testShuffle" class="debug-btn">Тест перемешивания</button>
                <button id="testColors" class="debug-btn">Тест цветов</button>
            </div>
        </div>
    </div>

    <!-- Unity скрипт -->
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/rubiks_cube_3d.loader.js";
        var config = {
            dataUrl: buildUrl + "/rubiks_cube_3d.data.unityweb",
            frameworkUrl: buildUrl + "/rubiks_cube_3d.framework.js.unityweb",
            codeUrl: buildUrl + "/rubiks_cube_3d.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "RubiksCube3D",
            productVersion: "1.0",
        };

        // Адаптация
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.head.appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "500px";
            canvas.style.height = "500px";
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                
                // КРИТИЧНО: устанавливаем глобальную переменную
                window.unityInstance = unityInstance;
                console.log("Unity загружен, instance готов");
                
                // Уведомляем UI, что Unity готов
                if (window.onUnityReady) {
                    window.onUnityReady(unityInstance);
                }
                
                // Обновляем статус
                const status = document.getElementById('debugStatus');
                if (status) status.textContent = "Unity загружен ✓";
                
            }).catch((message) => {
                alert("Ошибка загрузки Unity: " + message);
                const status = document.getElementById('debugStatus');
                if (status) status.textContent = "Ошибка загрузки Unity";
            });
        };
        document.body.appendChild(script);
    </script>
    
    <!-- Пользовательские скрипты -->
    <script src="custom.js"></script>
</body>
</html>
