<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кубик Рубика 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <!-- Контейнер приложения -->
    <div class="app-container">
        <!-- Кнопки слева -->
        <div class="left-panel">
            <button class="hamburger-btn" id="menuToggle" title="Меню">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="mode-selector">
                <div class="mode-btn active" data-mode="auto" title="Автоматическая сборка">
                    <i class="fas fa-robot"></i>
                    <span class="mode-label">A</span>
                </div>
                <div class="mode-btn" data-mode="manual" title="Ручная сборка">
                    <i class="fas fa-hand-paper"></i>
                    <span class="mode-label">P</span>
                </div>
            </div>
        </div>

        <!-- Центр: Unity -->
        <div class="unity-center">
            <div id="unity-container" class="unity-desktop">
                <canvas id="unity-canvas" width="400" height="400" tabindex="-1"></canvas>
                <div id="unity-loading-bar">
                    <div id="unity-logo"></div>
                    <div id="unity-progress-bar-empty">
                        <div id="unity-progress-bar-full"></div>
                    </div>
                </div>
                <div id="unity-warning"></div>
            </div>
        </div>

        <!-- Кнопки справа -->
        <div class="right-panel">
            <button class="control-btn shuffle-btn" id="shuffleBtn" title="Перемешать кубик">
                <i class="fas fa-random"></i> Перемешать
            </button>
            <button class="control-btn undo-btn" id="undoBtn" title="Шаг назад">
                <i class="fas fa-undo"></i> Шаг назад
            </button>
            <button class="control-btn hint-btn" id="hintBtn" title="Подсказка">
                <i class="fas fa-lightbulb"></i> Подсказка
            </button>
        </div>
    </div>

    <!-- Unity скрипт -->
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/rubiks_cube_3d.loader.js";
        var config = {
            dataUrl: buildUrl + "/rubiks_cube_3d.data.unityweb",
            frameworkUrl: buildUrl + "/rubiks_cube_3d.framework.js.unityweb",
            codeUrl: buildUrl + "/rubiks_cube_3d.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "RubiksCube3D",
            productVersion: "1.0",
        };

        // Адаптация под мобильные устройства
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.head.appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "400px";
            canvas.style.height = "400px";
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                console.log("✓ Unity загружен успешно");
                
                // Сохраняем instance
                window.unityInstance = unityInstance;
                
                // Уведомляем UI
                if (window.onUnityReady) {
                    window.onUnityReady(unityInstance);
                }
                
            }).catch((message) => {
                console.error("Ошибка загрузки Unity:", message);
                alert("Ошибка загрузки Unity: " + message);
            });
        };
        document.body.appendChild(script);
    </script>
    
    <!-- Пользовательские скрипты -->
    <script src="custom.js"></script>
</body>
</html>
