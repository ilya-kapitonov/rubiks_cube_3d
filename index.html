<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кубик Рубика 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <!-- Главный контейнер -->
    <div class="app-container">
        <!-- Заголовок -->
        <div class="header">
            <h1 class="title">Кубик Рубика 3D</h1>
            <div class="timer" id="timer">00:00.00</div>
        </div>

        <!-- Основной контент -->
        <div class="main-content">
            <!-- Левая панель управления -->
            <div class="left-panel">
                <button class="control-btn shuffle-btn" id="shuffleBtn" title="Перемешать кубик">
                    <i class="fas fa-random"></i> Перемешать
                </button>
                <button class="control-btn undo-btn" id="undoBtn" title="Шаг назад (Ctrl+Z)">
                    <i class="fas fa-undo"></i> Шаг назад
                </button>
                <button class="control-btn hint-btn" id="hintBtn" title="Подсказка (1 шаг)">
                    <i class="fas fa-lightbulb"></i> Подсказка
                </button>
            </div>

            <!-- Unity контейнер -->
            <div id="unity-container" class="unity-desktop">
                <canvas id="unity-canvas" width="400" height="400" tabindex="-1"></canvas>
                <div id="unity-loading-bar">
                    <div id="unity-logo"></div>
                    <div id="unity-progress-bar-empty">
                        <div id="unity-progress-bar-full"></div>
                    </div>
                </div>
                <div id="unity-warning"></div>
            </div>

            <!-- Правая панель -->
            <div class="right-panel">
                <button class="hamburger-btn" id="menuToggle" title="Меню">
                    <i class="fas fa-bars"></i>
                </button>
                
                <div class="mode-selector">
                    <div class="mode-btn active" data-mode="auto" title="Автоматическая сборка">
                        <i class="fas fa-robot"></i>
                        <span class="mode-label">A</span>
                    </div>
                    <div class="mode-btn" data-mode="manual" title="Ручная сборка">
                        <i class="fas fa-hand-paper"></i>
                        <span class="mode-label">P</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Нижняя панель -->
        <div class="bottom-panel">
            <!-- Счетчик шагов -->
            <div class="steps-counter">
                <i class="fas fa-footsteps"></i>
                <span class="steps-label">Шаги: </span>
                <span class="steps-value" id="stepsCounter">0</span>
            </div>
            
            <!-- Ползунок скорости -->
            <div class="speed-control-compact">
                <span class="speed-label">Скорость анимации:</span>
                <div class="speed-slider">
                    <div class="speed-track"></div>
                    <div class="speed-thumb" id="speedThumb"></div>
                    <div class="speed-markers">
                        <div class="speed-marker" data-speed="1"></div>
                        <div class="speed-marker" data-speed="4"></div>
                        <div class="speed-marker" data-speed="8"></div>
                        <div class="speed-marker" data-speed="12"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Боковое меню -->
        <div class="side-menu" id="sideMenu">
            <div class="menu-header">
                <h3><i class="fas fa-sliders-h"></i> МЕНЮ</h3>
                <button class="close-btn" id="closeMenu">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="menu-section">
                <h4 class="menu-section-title" id="toggleCustomization">
                    <i class="fas fa-palette"></i> Кастомизация кубика
                </h4>
                <div class="color-customization" id="colorCustomization">
                    <!-- Пресеты цветов -->
                    <div class="color-presets">
                        <div class="color-preset-btn active" data-preset="classic" title="Классические цвета">
                            <div class="preset-colors">
                                <span style="background: #FFFFFF"></span>
                                <span style="background: #FFD500"></span>
                                <span style="background: #009B48"></span>
                                <span style="background: #0046AD"></span>
                                <span style="background: #B71234"></span>
                                <span style="background: #FF5800"></span>
                            </div>
                            <span>Классический</span>
                        </div>
                        
                        <div class="color-preset-btn" data-preset="bright_pastel" title="Яркие пастельные">
                            <div class="preset-colors">
                                <span style="background: #FFE5E5"></span>
                                <span style="background: #FFE5B4"></span>
                                <span style="background: #B4FFB4"></span>
                                <span style="background: #B4E1FF"></span>
                                <span style="background: #FFB4FF"></span>
                                <span style="background: #E1B4FF"></span>
                            </div>
                            <span>Пастельный</span>
                        </div>
                        
                        <div class="color-preset-btn" data-preset="neon" title="Неоновые цвета">
                            <div class="preset-colors">
                                <span style="background: #FFFFFF"></span>
                                <span style="background: #FFFF00"></span>
                                <span style="background: #00FF00"></span>
                                <span style="background: #00FFFF"></span>
                                <span style="background: #FF00FF"></span>
                                <span style="background: #FF0000"></span>
                            </div>
                            <span>Неоновый</span>
                        </div>
                        
                        <div class="color-preset-btn" data-preset="monochrome" title="Монохромная схема">
                            <div class="preset-colors">
                                <span style="background: #F0F0F0"></span>
                                <span style="background: #C0C0C0"></span>
                                <span style="background: #909090"></span>
                                <span style="background: #606060"></span>
                                <span style="background: #303030"></span>
                                <span style="background: #101010"></span>
                            </div>
                            <span>Монохромный</span>
                        </div>
                    </div>
                    
                    <!-- Пользовательская схема -->
                    <div class="custom-scheme-section">
                        <h5>Своя цветовая схема:</h5>
                        <div class="cube-net" id="cubeNet">
                            <div class="net-cell" data-face="up"></div>
                            <div class="net-row">
                                <div class="net-cell" data-face="left"></div>
                                <div class="net-cell" data-face="front"></div>
                                <div class="net-cell" data-face="right"></div>
                                <div class="net-cell" data-face="back"></div>
                            </div>
                            <div class="net-cell" data-face="down"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="menu-section">
                <h4 class="menu-section-title">
                    <i class="fas fa-cogs"></i> Алгоритм сборки
                </h4>
                <div class="algorithm-selector">
                    <label class="radio-option">
                        <input type="radio" name="algorithm" value="quick" checked>
                        <span class="radio-checkmark"></span>
                        <span class="radio-label">Быстрая сборка</span>
                        <span class="radio-desc">Оптимальный алгоритм (20-25 шагов)</span>
                    </label>
                    
                    <label class="radio-option">
                        <input type="radio" name="algorithm" value="cross">
                        <span class="radio-checkmark"></span>
                        <span class="radio-label">Поэтапная сборка</span>
                        <span class="radio-desc">Крест → Углы → Второй слой → Верх</span>
                    </label>
                </div>
            </div>
            
            <div class="menu-section">
                <h4 class="menu-section-title" id="toggleStats">
                    <i class="fas fa-chart-line"></i> Статистика
                </h4>
                <div class="stats-panel" id="statsPanel">
                    <div class="stat-item">
                        <span class="stat-label">Лучшее время:</span>
                        <span class="stat-value" id="bestTime">--:--.--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Всего собрано:</span>
                        <span class="stat-value" id="totalSolved">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Среднее время:</span>
                        <span class="stat-value" id="avgTime">--:--.--</span>
                    </div>
                </div>
            </div>
            
            <div class="menu-section">
                <button class="menu-btn" id="saveState">
                    <i class="fas fa-save"></i> Сохранить состояние кубика
                </button>
                <button class="menu-btn" id="loadState">
                    <i class="fas fa-folder-open"></i> Загрузить последнее сохранение
                </button>
            </div>
            
            <div class="menu-section">
                <button class="menu-btn" id="helpBtn">
                    <i class="fas fa-question-circle"></i> Справочная информация
                </button>
            </div>
        </div>

        <!-- Модальное окно выбора цвета -->
        <div class="color-modal" id="colorModal">
            <div class="color-modal-content">
                <div class="color-modal-header">
                    <h4>Выберите цвет</h4>
                    <button class="close-modal" id="closeColorModal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="color-palette">
                    <!-- Генерируется через JS -->
                </div>
                <div class="color-preview-container">
                    <div class="color-preview" id="colorPreview"></div>
                    <input type="text" class="color-input" id="colorInput" value="#FF0000" maxlength="7">
                </div>
                <div class="color-modal-buttons">
                    <button class="modal-btn cancel-btn" id="cancelColor">Отмена</button>
                    <button class="modal-btn confirm-btn" id="applyColor">Применить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Unity скрипт -->
    <script>
        // Unity конфигурация (уменьшенный размер)
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/rubiks_cube_3d.loader.js";
        var config = {
            dataUrl: buildUrl + "/rubiks_cube_3d.data.unityweb",
            frameworkUrl: buildUrl + "/rubiks_cube_3d.framework.js.unityweb",
            codeUrl: buildUrl + "/rubiks_cube_3d.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "RubiksCube3D",
            productVersion: "0.1",
        };

        // Адаптация под мобильные устройства
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.head.appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "400px";
            canvas.style.height = "400px";
        }

        loadingBar.style.display = "block";

        // Загрузка Unity
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                window.unityInstance = unityInstance;
                if (window.onUnityReady) {
                    window.onUnityReady(unityInstance);
                }
            }).catch((message) => {
                alert("Ошибка загрузки Unity: " + message);
            });
        };
        document.body.appendChild(script);
    </script>
    
    <!-- Пользовательские скрипты -->
    <script src="custom.js"></script>
</body>
</html>
